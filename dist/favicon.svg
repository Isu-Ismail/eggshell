<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Drop shadow -->
  <path d="M 50,10 C 20,10 10,40 10,65 C 10,88 30,95 50,95 C 70,95 90,88 90,65 C 90,40 80,10 50,10 Z" fill="#111827" transform="translate(4, 5)"/>
  
  <!-- Egg shape -->
  <path d="M 50,10 C 20,10 10,40 10,65 C 10,88 30,95 50,95 C 70,95 90,88 90,65 C 90,40 80,10 50,10 Z" fill="#22C55E" stroke="#111827" stroke-width="5"/>
  
  <!-- "ExShell" logo symbol -->
  <g stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- White background outline for the X structure (creates a sticker pop) -->
    <g stroke="#FFF" stroke-width="13">
      <circle cx="36" cy="46" r="8" fill="#FFF"/>
      <circle cx="64" cy="46" r="8" fill="#FFF"/>
      <path d="M 44,46 L 44,52 L 60,74" />
      <path d="M 56,46 L 56,52 L 40,74" />
    </g>

    <!-- Actual black strokes -->
    <circle cx="36" cy="46" r="8" fill="#FFF"/>
    <circle cx="64" cy="46" r="8" fill="#FFF"/>
    
    <!-- Left leg -->
    <path d="M 44,46 L 44,52 L 60,74" />
    <!-- Right leg -->
    <path d="M 56,46 L 56,52 L 40,74" />
    
  </g>
</svg>